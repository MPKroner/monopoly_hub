<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="40%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 12" opacity="0.4"/>

  <!-- Top Hat Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Hat Crown / Top -->
    <path d="M 160 140 L 352 140 C 358 140 363 145 362 152 L 344 320 L 168 320 L 150 152 C 149 145 154 140 160 140 Z" fill="url(#hatGrad)"/>
    
    <!-- Crown Top Ellipse -->
    <ellipse cx="256" cy="140" rx="96" ry="24" fill="#374151"/>

    <!-- Red Ribbon -->
    <path d="M 167 280 L 345 280 L 344 320 L 168 320 Z" fill="url(#ribbonGrad)"/>
    <!-- Gold Buckle on Ribbon -->
    <rect x="238" y="276" width="36" height="48" rx="6" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <rect x="246" y="284" width="20" height="32" rx="3" fill="#be123c"/>

    <!-- Hat Brim / Base Ellipse -->
    <ellipse cx="256" cy="326" rx="160" ry="34" fill="#111827"/>
    <ellipse cx="256" cy="322" rx="156" ry="30" fill="#1f2937"/>
    <ellipse cx="256" cy="320" rx="150" ry="26" fill="#111827"/>
  </g>

  <!-- Red Monopoly banner bar at bottom -->
  <g filter="url(#shadow)">
    <rect x="76" y="380" width="360" height="64" rx="14" fill="#e11d48"/>
    <rect x="80" y="384" width="352" height="56" rx="10" fill="none" stroke="#fff" stroke-width="2" stroke-opacity="0.8"/>
    <text x="256" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">MONOPOLY</text>
  </g>
</svg>
